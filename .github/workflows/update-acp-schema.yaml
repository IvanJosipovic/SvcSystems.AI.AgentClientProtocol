name: Update ACP Schemas

on:
  workflow_dispatch:

  schedule:
    - cron: "12 0 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-acp-schemas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update ACP schemas
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: chore/update-acp-schemas
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pwsh ./scripts/Update-AcpSchemas.ps1 -CreatePr
